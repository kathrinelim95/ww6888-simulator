[project]
name = "virtual-credit-simulator"
version = "0.1.0"
description = "Closed-loop virtual-credit betting workflow simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<2.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pwdlib[argon2]>=0.2",
  "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
